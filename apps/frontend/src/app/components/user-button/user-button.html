<button
  type="button"
  class="user-button"
  (click)="handleClick()"
  aria-label="Åpne innstillinger"
  i18n-aria-label="@@userButton.ariaLabel"
>
  <div
    class="user-button__avatar"
    aria-label="Profilbilde for {{ user().name }}"
    i18n-aria-label="@@userButton.avatarAriaLabel"
  >
    {{ userInitials() }}
  </div>
  <span class="user-button__name">{{ user().name }}</span>
  <span class="user-button__settings-icon" aria-hidden="true">⚙️</span>
</button>
