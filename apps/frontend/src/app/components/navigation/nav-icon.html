<!-- Diddit nav icons, as drawn in the signed-off picture (docs/design/diddit/reference/poeng-signed-off.png).
     21-unit viewBox so one unit is one rendered pixel in the 21 px box (--nav-icon): stroke 1.5 renders
     the picture's measured 1.5 px line. Ink per item: Hjem 18.0 x 18.0, Oppgaver 17.0 x 12.0,
     Belønninger 18.0 x 17.5, Familie 17.0 x 15.0. Stroked in currentColor. -->
@switch (name()) {
  @case ('home') {
    <svg viewBox="0 0 21 21" fill="none" aria-hidden="true">
      <path
        d="M2.25 8.54 10.5 2.25l8.25 6.29V17.56a1.2 1.2 0 0 1-1.21 1.19h-4.01v-5.1H7.47v5.1H3.46a1.2 1.2 0 0 1-1.21-1.19Z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
    </svg>
  }
  @case ('tasks') {
    <!-- the picture's bullet is a dash, not a dot -->
    <svg viewBox="0 0 21 21" fill="none" aria-hidden="true">
      <path
        d="M6.75 5.25h11.5M6.75 10.5h11.5M6.75 15.75h11.5M2.75 5.25h1.5M2.75 10.5h1.5M2.75 15.75h1.5"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>
  }
  @case ('rewards') {
    <!-- a lid band over a narrower box, centre ribbon, and the picture's small two-loop bow -->
    <svg viewBox="0 0 21 21" fill="none" aria-hidden="true">
      <rect x="2.25" y="6" width="16.5" height="3" stroke="currentColor" stroke-width="1.5" />
      <rect x="2.75" y="10.5" width="15.5" height="8" stroke="currentColor" stroke-width="1.5" />
      <!-- the ribbon carries up into the bow, so the centre closes at the foot as the picture draws it -->
      <path d="M10.5 4.4V18.5" stroke="currentColor" stroke-width="1.5" />
      <!-- each loop leans outward and keeps a slit open at its inner foot. That slit is one pixel
           of near-white at this size, so the geometry is held to 0.01 unit. -->
      <ellipse
        cx="0"
        cy="0"
        rx="1.6"
        ry="1.3"
        stroke="currentColor"
        stroke-width="1.5"
        transform="translate(7.8 3.81) rotate(-8)"
      />
      <ellipse
        cx="0"
        cy="0"
        rx="1.6"
        ry="1.3"
        stroke="currentColor"
        stroke-width="1.5"
        transform="translate(13.2 3.81) rotate(8)"
      />
    </svg>
  }
  @case ('family') {
    <!-- a large head and a small head: the picture draws a parent and a child, each on its own
         shoulder arc, not a head and a half-arc crescent -->
    <svg viewBox="0 0 21 21" fill="none" aria-hidden="true">
      <circle cx="7.75" cy="6.55" r="2.85" stroke="currentColor" stroke-width="1.5" />
      <path
        d="M2.75 17.25c0-2.76 2.24-5 5-5s5 2.24 5 5"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
      <circle cx="15" cy="8" r="2.25" stroke="currentColor" stroke-width="1.5" />
      <path
        d="M13.25 12.25c2.76 0 5 2.24 5 5"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>
  }
  @case ('progress') {
    <!-- not in the signed-off picture: the shipped drawing re-expressed in the 21-unit box so the
         set carries one line weight where the desktop tab row shows it beside the other four -->
    <svg viewBox="0 0 21 21" fill="none" aria-hidden="true">
      <path
        d="M2.33 18.67h16.34M4.67 18.67V11.67M10.5 18.67V5.83M16.33 18.67V9.33"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>
  }
}
