<nav
  class="child-nav"
  role="navigation"
  i18n-aria-label="@@nav.childNavigation"
  aria-label="Barnenavigasjon"
>
  @for (item of navItems; track item.id) {
    <button
      type="button"
      class="child-nav-btn"
      [class.active]="isActive(item.id)"
      (click)="handleNavClick(item.id)"
      [attr.aria-current]="isActive(item.id) ? 'page' : null"
    >
      <app-nav-icon class="child-nav-icon" [name]="item.icon" />
      <span class="child-nav-label">{{ item.label }}</span>
    </button>
  }
</nav>
