<!-- The white row. The clickable part and a projected action (the child's QR button) sit side by
     side in it, so a button is never nested inside the role="button" (ST-954) -->
<div class="member-item">
  <div
    class="member-card"
    [class.clickable]="clickable()"
    (click)="handleClick()"
    [attr.role]="clickable() ? 'button' : null"
    [attr.tabindex]="clickable() ? 0 : null"
    [attr.aria-label]="clickable() ? ariaLabel() : null"
    (keydown.enter)="handleClick()"
    (keydown.space)="handleClick()"
  >
    <div class="member-avatar" aria-hidden="true">{{ initials() }}</div>

    <div class="member-info">
      <div class="member-name">{{ member().name }}</div>
      <div class="member-meta">
        @if (member().role === 'parent') {
          <ng-container i18n="@@memberCard.roleParent">Forelder</ng-container>
        } @else if (showStats()) {
          <span class="member-points" i18n="@@memberCard.pointsShort"
            >{{ member().points || 0 }} p</span
          >
          ·
          <span i18n="@@memberCard.doneOf"
            >{{ member().tasksCompleted || 0 }} av {{ member().totalTasks || 0 }} gjort</span
          >
        } @else {
          <ng-container i18n="@@memberCard.roleChild">Barn</ng-container>
        }
      </div>
    </div>
  </div>
  <ng-content select="[member-action]" />
</div>
