<div
  class="task-card"
  [class.completed]="completed()"
  [class.overdue]="isOverdue()"
  [class.clickable]="clickable()"
  (click)="onCardClick()"
  (keydown)="onKeyDown($event)"
  [attr.tabindex]="clickable() ? '0' : null"
  [attr.role]="clickable() ? 'button' : null"
  [attr.aria-label]="clickable() ? 'Rediger ' + taskName() : null"
>
  <!-- Complete Button -->
  @if (showCompleteButton() && !completed()) {
    <button
      class="task-complete-btn"
      (click)="onCompleteClick($event)"
      [attr.aria-label]="'Merk ' + taskName() + ' som fullført'"
      type="button"
    >
      <span class="checkmark">✓</span>
    </button>
  }

  <!-- Task Info -->
  <div class="task-info">
    <h3 class="task-title">{{ taskName() }}</h3>
    <div class="task-meta">
      @if (metaText()) {
        <span
          class="task-meta-text"
          [class.status-overdue]="isOverdue()"
          [class.status-completed]="completed()"
        >
          @if (!isAssignment()) {
            <span class="icon">🔄</span>
          }
          {{ metaText() }}
        </span>
      }
    </div>
  </div>

  <!-- Points Badge -->
  @if (taskPoints() !== undefined) {
    <div class="task-badge">
      <span class="icon">⭐</span>
      <span class="points">{{ taskPoints() }}</span>
    </div>
  }

  <!-- "Påminn nå": push the reminder to the child's phone now (ST-686) -->
  @if (showRemindButton() && canRemind()) {
    <button
      class="task-remind-btn"
      type="button"
      (click)="onRemindClick($event)"
      (keydown)="$event.stopPropagation()"
      [disabled]="reminding()"
      [attr.aria-label]="'Påminn ' + childName() + ' om ' + taskName() + ' nå'"
    >
      <span class="remind-icon" aria-hidden="true">🔔</span>
      <span i18n="@@taskCard.remindNow">Påminn nå</span>
    </button>
  }

  <!-- Reassign Button (for assignments only) -->
  @if (showReassignButton() && isAssignment() && !completed()) {
    <button
      class="task-reassign-btn"
      (click)="onReassignClick($event)"
      [attr.aria-label]="'Tilordne ' + taskName() + ' på nytt'"
      type="button"
      i18n-title="@@taskCard.reassignToAnotherChild"
      title="Tilordne til et annet barn"
    >
      <span class="reassign-icon">🔄</span>
    </button>
  }
</div>
