<!-- Select mode (ST-1343): the whole row is the checkbox, its name the title and the meta line -->
@if (selectable()) {
  <button
    type="button"
    class="row row-select"
    role="checkbox"
    [class.overdue]="overdue()"
    [attr.aria-checked]="selected()"
    (click)="toggle.emit()"
  >
    <span class="cb" [class.on]="selected()" aria-hidden="true">
      @if (selected()) {
        <svg width="13" height="10" viewBox="0 0 13 10" fill="none" aria-hidden="true">
          <path
            d="M1.4 5.1 4.7 8.4 11.4 1.7"
            stroke="#fff"
            stroke-width="2.1"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      }
    </span>
    <span class="rowtext">
      <span class="rt">{{ title() }}</span>
      @if (meta()) {
        <span class="rm" [class.rust]="overdue()">{{ meta() }}</span>
      }
    </span>
    @if (points()) {
      <span class="pts">{{ points() }}</span>
    }
  </button>
} @else {
  <!-- A pressable row draws the 2 px Ink line inside the card while a finger holds it (ST-1391) -->
  <div
    class="row"
    [class.overdue]="overdue()"
    [class.has-note]="note()"
    [class.pressable]="pressable()"
    [class.held]="held()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="cancelPress()"
    (pointercancel)="cancelPress()"
    (pointerleave)="cancelPress()"
    (contextmenu)="onContextMenu($event)"
  >
    @if (done()) {
      <span class="cb done" role="img" i18n-aria-label="@@choreRow.done" aria-label="Gjort">
        <svg width="13" height="10" viewBox="0 0 13 10" fill="none" aria-hidden="true">
          <path
            d="M1.4 5.1 4.7 8.4 11.4 1.7"
            stroke="#fff"
            stroke-width="2.1"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    } @else if (checkable()) {
      <button
        type="button"
        class="cb"
        [disabled]="busy()"
        [attr.aria-busy]="busy()"
        [attr.aria-label]="checkLabel(title())"
        (click)="check.emit()"
      ></button>
    } @else {
      <span class="cb" aria-hidden="true"></span>
    }

    @if (openable()) {
      <button type="button" class="rowtext rowtext-btn" (click)="open.emit()">
        <span class="rt">{{ title() }}</span>
        @if (meta()) {
          <span class="rm" [class.rust]="overdue()">{{ meta() }}</span>
        }
      </button>
    } @else {
      <span class="rowtext">
        <span class="rt">{{ title() }}</span>
        @if (meta()) {
          <span class="rm" [class.rust]="overdue()">{{ meta() }}</span>
        }
      </span>
    }

    @if (points()) {
      <span class="pts">{{ points() }}</span>
    }
    <ng-content select="[row-action]" />

    @if (note(); as n) {
      <span class="note" [class.rust]="n.tone === 'overdue'">
        @if (n.tone === 'overdue') {
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M8 2.2 14.6 13.6H1.4Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
            <path d="M8 6.6v3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <circle cx="8" cy="11.7" r="0.95" fill="currentColor" />
          </svg>
        } @else {
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path
              d="M2.2 8.4 6 12.1 13.8 4.3"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
        {{ n.text }}
      </span>
    }
  </div>
}
