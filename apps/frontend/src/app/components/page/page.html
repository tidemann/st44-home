<div class="page" [class]="containerClass()" [class.page--split]="split()">
  <!-- Title row: screen name left, the person's initial badge right (guide: Initial badge).
       With [band], the title area is the yellow top (guide: A — the yellow top).
       With [split], from 1024 px the title and the band's content share one line (desktop A). -->
  @if (showHeader()) {
    <header class="page-header" [class]="headerClass()" [class.page-header--band]="band()">
      <div class="page-header-inner">
        <div class="page-header-content">
          <div class="page-header-text">
            @if (titleMenu()) {
              <!-- The caret sits right after the name, also on its last line (ST-1065) -->
              <h1 class="page-title">
                <button
                  type="button"
                  class="page-title-menu"
                  aria-haspopup="dialog"
                  (click)="titleMenuOpen.emit()"
                >
                  {{ title()
                  }}<span class="visually-hidden" i18n="@@page.switchHousehold">
                    – bytt husstand</span
                  ><svg
                    class="page-title-caret"
                    width="14"
                    height="14"
                    viewBox="0 0 14 14"
                    fill="none"
                    aria-hidden="true"
                  >
                    <path
                      d="M2.5 5L7 9.5L11.5 5"
                      stroke="currentColor"
                      stroke-width="2.2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
              </h1>
            } @else {
              <h1 class="page-title">{{ title() }}</h1>
            }
          </div>
          <div class="page-header-actions">
            <ng-content select="[page-actions]" />
            @if (showUserButton()) {
              <!-- From 1024 px the badge sits in the yellow top's tab row instead -->
              <app-initial-badge class="page-badge" [onYellow]="band()" />
            }
          </div>
        </div>
        @if (band()) {
          <div class="page-band">
            @if (subtitle()) {
              <p class="page-subtitle">{{ subtitle() }}</p>
            }
            <div class="page-band-slot">
              <ng-content select="[page-band]" />
            </div>
          </div>
        }
      </div>
    </header>
  }

  <main class="page-content">
    @if (showHeader() && !band() && subtitle()) {
      <p class="page-subtitle">{{ subtitle() }}</p>
    }
    <ng-content />
  </main>
</div>
