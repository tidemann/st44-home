<div class="page" [class]="containerClass()">
  <!-- Title row: screen name left, the person's initial badge right (guide: Initial badge).
       With [band], the title area is the yellow top (guide: A — the yellow top). -->
  @if (showHeader()) {
    <header class="page-header" [class]="headerClass()" [class.page-header--band]="band()">
      <div class="page-header-content">
        <div class="page-header-text">
          <h1 class="page-title">{{ title() }}</h1>
        </div>
        <div class="page-header-actions">
          <ng-content select="[page-actions]" />
          @if (showUserButton() && initial(); as letter) {
            <div class="badge-wrap">
              <button
                type="button"
                class="initial-badge"
                (click)="onBadgeClick()"
                [attr.aria-label]="badgeLabel()"
                [attr.aria-expanded]="isChild() ? menuOpen() : null"
              >
                {{ letter }}
              </button>
              @if (menuOpen()) {
                <div class="badge-menu">
                  <button type="button" class="badge-menu-item" (click)="onLogout()">
                    <ng-container i18n="@@page.logout">Logg ut</ng-container>
                  </button>
                </div>
              }
            </div>
          }
        </div>
      </div>
      @if (band()) {
        <div class="page-band">
          @if (subtitle()) {
            <p class="page-subtitle">{{ subtitle() }}</p>
          }
          <ng-content select="[page-band]" />
        </div>
      }
    </header>
  }

  <main class="page-content">
    @if (showHeader() && !band() && subtitle()) {
      <p class="page-subtitle">{{ subtitle() }}</p>
    }
    <ng-content />
  </main>
</div>
