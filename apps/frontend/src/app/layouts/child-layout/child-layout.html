<div class="child-layout">
  <!-- The yellow top's tab row (1024 px and wider; guide: Desktop and tablet — layout A) -->
  @if (desktop()) {
    <app-top-tabs
      [tabs]="desktopTabs"
      [activeId]="activeScreen()"
      (navigate)="onNavigate($event)"
    />
  }

  <!-- Each child screen draws its own Poeng title row; "Logg ut" sits behind the initial badge -->
  <main class="child-content">
    <router-outlet />
  </main>

  <app-child-nav [activeScreen]="activeScreen()" (navigate)="onNavigate($event)" />
</div>
