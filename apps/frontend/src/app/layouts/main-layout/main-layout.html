<div class="layout-container">
  <!-- Sidebar Navigation (Desktop) -->
  <div class="sidebar-container">
    <app-sidebar-nav
      [activeScreen]="activeScreen()"
      (navigate)="onNavigate($event)"
      (addTask)="openCreateTask()"
    />
  </div>

  <!-- Main Content Area -->
  <div class="main-content">
    <!-- Mobile Header: only on screens without their own Poeng title row -->
    @if (!ownHead()) {
      <header class="mobile-header">
        <div class="mobile-header-content">
          <div class="mobile-logo">Diddit!</div>
          <div class="mobile-header-actions">
            <app-household-switcher />
            <app-user-button [user]="userData()" (clicked)="onSettings()" />
          </div>
        </div>
      </header>
    } @else {
      <!-- Renders nothing unless the parent belongs to more than one household -->
      <app-household-switcher class="switcher-slot" />
    }

    <!-- Router Outlet for Page Content -->
    <router-outlet />

    <!-- Bottom Navigation (Mobile) -->
    <div class="bottom-nav-container">
      <app-bottom-nav [activeScreen]="activeScreen()" (navigate)="onNavigate($event)" />
    </div>
  </div>

  <!-- Task Form Modal (Create mode) -->
  @if (householdId()) {
    <app-task-form-modal
      [open]="createTaskOpen()"
      mode="create"
      [householdId]="householdId()!"
      [children]="children()"
      (closeRequested)="closeCreateTask()"
      (formSubmitted)="onTaskFormSubmit($event)"
    />
  }
</div>
