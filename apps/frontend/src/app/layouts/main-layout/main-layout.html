<div class="layout-container">
  <!-- The yellow top's tab row (1024 px and wider; guide: Desktop and tablet — layout A) -->
  @if (desktop()) {
    <app-top-tabs
      [tabs]="desktopTabs"
      [activeId]="activeScreen()"
      (navigate)="onNavigate($event)"
    />
  }

  <!-- Main Content Area -->
  <div class="main-content">
    <!-- Mobile Header: only on screens without their own Poeng title row -->
    @if (!ownHead()) {
      <header class="mobile-header">
        <div class="mobile-header-content">
          <div class="mobile-logo">Diddit!</div>
          <div class="mobile-header-actions">
            <app-user-button [user]="userData()" (clicked)="onSettings()" />
          </div>
        </div>
      </header>
    }

    <!-- Router Outlet for Page Content -->
    <router-outlet />

    <!-- Bottom Navigation (under 1024 px) -->
    <div class="bottom-nav-container">
      <app-bottom-nav [activeScreen]="activeScreen()" (navigate)="onNavigate($event)" />
    </div>
  </div>
</div>
