# The visitor's address for the backend's per-IP rate limits (ST-2114). Cloudflare sets
# CF-Connecting-IP to the address it saw; the host's TLS proxy sits between it and us, so
# $remote_addr is that proxy. The header counts only from a private-network peer (that
# proxy): a request straight to our published port is counted by its own address, whatever
# header it sends. The backend gets this one address in X-Forwarded-For, never a list the
# client could have started; without Cloudflare (docker compose) it is $remote_addr.
# Assumes the host's TLS proxy is reached only through Cloudflare; if it also answers
# direct requests, those can set CF-Connecting-IP and pick their own rate-limit bucket.
geo $from_private_peer {
  default        0;
  127.0.0.0/8    1;
  10.0.0.0/8     1;
  172.16.0.0/12  1;
  192.168.0.0/16 1;
}

map "$from_private_peer:$http_cf_connecting_ip" $visitor_ip {
  "~^1:(?<cf_ip>.+)$" $cf_ip;
  default             $remote_addr;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Redirects keep the client's scheme. TLS ends at the proxy in front of us, so
  # an absolute redirect built here says http:// and sent https visitors of `/`
  # to http://home.st44.no/no/ (ST-621).
  absolute_redirect off;

  # Plain-http visitors go to https. Cloudflare sets CF-Visitor from the
  # visitor's own scheme, so this cannot loop on an https request; without the
  # header (local docker compose) nothing is redirected.
  if ($http_cf_visitor ~ '"scheme":"http"') {
    return 301 https://$host$request_uri;
  }

  # Security headers. No Content-Security-Policy here: the proxy in front sets
  # the live one, with a per-request script nonce, and a second header from us
  # only stacked a looser policy on top of it (ST-621).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Proxy API requests to backend
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $visitor_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy health check to backend
  location /health {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $visitor_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Redirect root to Norwegian locale
  location = / {
    return 302 /no/;
  }

  # «Etter tur» chores (ST-2075): the printed QR code and the NFC sticker hold the short
  # link https://home.st44.no/s/<code>; it opens the app's scan page. No {n,m} in this
  # unquoted regex: nginx reads the brace as the block start and will not start.
  location ~ ^/s/([A-Za-z0-9]+)/?$ {
    return 302 /no/s/$1;
  }

  # Service worker and web app manifest (ST-623): never cached by the browser or
  # Cloudflare, so a deploy reaches installed phones. add_header here replaces
  # the server-level headers, so they are repeated.
  location = /no/sw.js {
    alias /usr/share/nginx/html/no/sw.js;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location = /no/manifest.webmanifest {
    alias /usr/share/nginx/html/no/manifest.webmanifest;
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Serve Norwegian locale frontend app
  location /no/ {
    alias /usr/share/nginx/html/no/;
    try_files $uri $uri/ /no/index.html;
  }
}
