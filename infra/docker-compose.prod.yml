# The stack that runs on the server, at /srv/st44-home/infra/docker-compose.yml.
#
# This is the deploy unit CI renders from. Every deploy, CI takes this file,
# pins the three ghcr images to this run's commit SHA (infra/render-deploy-
# compose.sh), and ships the result to /srv/st44-home/deploy.sh on stdin. That
# script — the forced command on st44-home's deploy key — installs it over the
# host file, keeps the previous one as docker-compose.yml.prev, pulls, recreates,
# runs migrations and gates on backend health. The host file is no longer a
# second source of truth; this file is what the server runs after every deploy.
#
# So the image tags below are deliberately `latest`, the record of the host file:
# the deploy does not edit them in place, it renders the pinned merge in CI.
# ${DB_PASSWORD} and friends stay literal in the rendered file so the host's own
# .env supplies them at runtime. If you change a service here, that is the change
# the next deploy applies to the server — the two can no longer disagree.
#
# This file is also the fixture for the CI job "Deploy pin overrides the server
# compose file", which runs the same render the deploy runs and checks that the
# three images come out on the pinned tag and that everything below survives it.
# That is how the pin is provable without a live deploy.
services:
  redis:
    image: redis:7-alpine
    container_name: st44-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: ghcr.io/tidemann/st44-home-db:latest
    container_name: st44-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: st44
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/tidemann/st44-home-backend:latest
    container_name: st44-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: st44
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@diddit.com}
      APP_URL: ${APP_URL:-http://localhost:4200}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 3100, not 80: the host's proxy terminates TLS for home.st44.no and forwards here.
  frontend:
    image: ghcr.io/tidemann/st44-home-frontend:latest
    container_name: st44-frontend
    restart: unless-stopped
    ports:
      - "3100:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    external: true
    name: st44_default
