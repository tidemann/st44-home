# diddit - diddit.no and www.diddit.no (Diddit, ST-2805)
# Backend: the st44-frontend container on st44_default, port 80: the same app as
# home.st44.no (the protected site `home`, which stays as it is). The container's own
# nginx sends /api to the backend.
# Install on spzmf: sudo agent-nginx install-site diddit <this file>
#   (after the certificates for diddit.no and www.diddit.no exist)

upstream diddit_upstream {
  zone diddit_upstream 64k;
  server st44-frontend:80 resolve;
}

server {
  listen 80;
  server_name diddit.no www.diddit.no;
  return 301 https://diddit.no$request_uri;
}

server {
  listen 443 ssl;
  server_name www.diddit.no;

  ssl_certificate /etc/letsencrypt/live/www.diddit.no/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/www.diddit.no/privkey.pem;

  return 301 https://diddit.no$request_uri;
}

server {
  listen 443 ssl;
  server_name diddit.no;

  ssl_certificate /etc/letsencrypt/live/diddit.no/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/diddit.no/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 10m;

  location / {
    proxy_pass http://diddit_upstream;
    include snippets/proxy-headers.conf;
    proxy_http_version 1.1;
  }
}
