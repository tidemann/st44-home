# TEMPORARY diagnostic workflow for ST-68. Delete once the cause is recorded.
#
# The Claude Code Review action hides its output ("full output hidden for
# security"), so a failing review only reports `is_error:true` with no reason.
# This probe calls the Claude Code CLI directly with the same secret so the
# actual error text is visible. It never prints the token: the value is only
# ever passed as an environment variable, and GitHub masks the secret in logs.
name: ST-68 OAuth probe

on:
  push:
    branches:
      - ci/st-68-claude-review-diagnosis

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report whether the secret is present
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is EMPTY or not set for this repository"
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN is set, length=${#TOKEN}, prefix=${TOKEN%%-*}"
          fi

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run a one-token prompt and capture the error
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          claude -p 'Reply with exactly: PROBE_OK' --output-format json > probe.json 2> probe.err
          code=$?
          set -e
          echo "exit code: $code"
          echo "--- stdout ---"
          cat probe.json || true
          echo "--- stderr ---"
          cat probe.err || true
