name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      # This review is advisory: the findings arrive as a PR comment, so the
      # check result only ever says whether the tooling ran. Letting an expired
      # credential or an upstream outage turn every PR red teaches the team to
      # ignore red checks, so infrastructure failures are reported as a warning
      # instead (see the "Report review status" step below). A real review
      # finding never fails this step.
      - name: Run Claude Code Review
        id: claude-review
        continue-on-error: true
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

      # Without this the check would be silently green whenever the review did
      # not actually run, which is the same trap as a permanently red check.
      - name: Report review status
        if: always()
        run: |
          if [ "${{ steps.claude-review.outcome }}" = "success" ]; then
            echo "Claude Code Review ran. Findings, if any, are a comment on this PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning title=Claude Code Review did not run::The review step failed, so this PR has NOT been reviewed by Claude. The check is advisory and does not block the PR. Check the step log for the cause; a revoked CLAUDE_CODE_OAUTH_TOKEN is the usual one."
          {
            echo "## :warning: Claude Code Review did not run"
            echo
            echo "This PR has **not** been reviewed by Claude. The check is advisory, so it does not block the PR."
            echo
            echo "Most likely causes:"
            echo "- \`CLAUDE_CODE_OAUTH_TOKEN\` is expired or revoked (the log shows \`401 OAuth access token has been revoked\`)."
            echo "- An upstream outage in \`anthropics/claude-code-action\`."
            echo
            echo "Note: the action also skips itself, reporting success, on any PR that edits"
            echo "\`.github/workflows/**\`, because it requires the workflow file to match the"
            echo "default branch. Such a PR is never reviewed either."
          } >> "$GITHUB_STEP_SUMMARY"
