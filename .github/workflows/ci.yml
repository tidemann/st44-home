name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # CI only triggers on PRs into main, so a PR stacked on another branch gets no
  # run at all. This makes the checks runnable on any ref on demand, which is also
  # how a stacked change gets verified before its base merges.
  workflow_dispatch:

jobs:
  # A floating tag lets an action move under a live deploy with no commit here.
  # This job is the cheapest check in CI, so it runs alongside the slow ones and
  # fails fast on an unpinned ref.
  workflows:
    name: Workflows are pinned by SHA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Actions are pinned by SHA
        run: |
          set -euo pipefail
          bad=0
          while read -r line; do
            ref="${line#*uses:}"
            # Drop the trailing `# v5` version comment before looking at the ref.
            ref="${ref%%#*}"
            ref="$(printf '%s' "$ref" | tr -d '[:space:]')"
            case "$ref" in
              ./*) continue ;;
            esac
            version="${ref#*@}"
            if ! printf '%s' "$version" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::not pinned by SHA: $ref"
              bad=1
            fi
          done < <(grep -rhE '^\s*-?\s*uses:' .github/workflows)
          exit "$bad"

  # The deploy pins its images with a generated compose override rather than by
  # editing the server's compose file, which CI cannot write. If that merge ever
  # stops working, the deploy goes green while quietly running `:latest` again --
  # which is the same thing as having no rollback anchor. This job is where that
  # merge is provable without a live deploy, using the same script the deploy runs.
  compose:
    name: Deploy pin overrides the server compose file
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: The pin wins, and the server's own settings survive it
        run: |
          set -euo pipefail
          # An obviously-not-a-tag value, so a hardcoded `:latest` cannot pass by luck.
          infra/generate-image-pin.sh ghcr.io/tidemann/st44-home st59-pin-probe > pin.yml
          cat pin.yml

          # Same merge order as the deploy: the server's file, then the pin.
          # infra/docker-compose.prod.yml mirrors the host copy, tags and all.
          # The deploy exports JWT_SECRET in its ssh session; a probe stands in here.
          # DB_PASSWORD comes from the host .env there; a probe stands in for that too.
          export DB_PASSWORD=st621-db-probe
          resolved="$(JWT_SECRET=st627-secret-probe docker compose -f infra/docker-compose.prod.yml -f pin.yml config)"

          bad=0

          # The backend gets the secret from the session (ST-627)...
          if ! printf '%s\n' "$resolved" | grep -qF 'JWT_SECRET: st627-secret-probe'; then
            echo "::error::the backend did not get JWT_SECRET from the deploy session"
            bad=1
          fi
          # ...and without one compose refuses, rather than starting a backend with none.
          if env -u JWT_SECRET docker compose -f infra/docker-compose.prod.yml -f pin.yml config --quiet 2>/dev/null; then
            echo "::error::compose accepted the pin with JWT_SECRET unset"
            bad=1
          fi
          # The database password has no `postgres` fallback either (ST-621): the
          # backend and the db both get the host's value, and none means no start.
          if [ "$(printf '%s\n' "$resolved" | grep -cE '(DB_PASSWORD|POSTGRES_PASSWORD): st621-db-probe')" -ne 2 ]; then
            echo "::error::backend and db did not both get DB_PASSWORD from the host environment"
            bad=1
          fi
          if env -u DB_PASSWORD JWT_SECRET=st627-secret-probe docker compose -f infra/docker-compose.prod.yml -f pin.yml config --quiet 2>/dev/null; then
            echo "::error::compose accepted the stack with DB_PASSWORD unset"
            bad=1
          fi
          # Web push keys (ST-623) reach the backend from the session, and are
          # optional: without them the stack still starts, with push off.
          if ! JWT_SECRET=st627-secret-probe VAPID_PRIVATE_KEY=st623-vapid-probe \
            docker compose -f infra/docker-compose.prod.yml -f pin.yml config \
            | grep -qF 'VAPID_PRIVATE_KEY: st623-vapid-probe'; then
            echo "::error::the backend did not get VAPID_PRIVATE_KEY from the deploy session"
            bad=1
          fi
          if ! env -u VAPID_PUBLIC_KEY -u VAPID_PRIVATE_KEY JWT_SECRET=st627-secret-probe \
            docker compose -f infra/docker-compose.prod.yml -f pin.yml config --quiet; then
            echo "::error::compose refused the stack without the optional VAPID keys"
            bad=1
          fi
          for svc in frontend backend db; do
            if ! printf '%s\n' "$resolved" \
              | grep -qF "image: ghcr.io/tidemann/st44-home-${svc}:st59-pin-probe"; then
              echo "::error::st44-home-${svc} did not take the pinned tag"
              bad=1
            fi
          done

          # No ghcr image may come out on anything else, whatever it is called.
          if printf '%s\n' "$resolved" | grep -E 'image: ghcr\.io/' | grep -v ':st59-pin-probe'; then
            echo "::error::the ghcr image above ignored the pin"
            bad=1
          fi

          # The override must not cost the server its own configuration: the
          # external proxy network, the frontend on 3100, the extra backend
          # environment. Losing any of those takes the live site down.
          for needle in 'st44_default' '"3100"' 'SENDGRID_API_KEY' 'APP_URL'; do
            if ! printf '%s\n' "$resolved" | grep -qF -- "$needle"; then
              echo "::error::the merged config lost ${needle}"
              bad=1
            fi
          done

          if [ "$bad" -eq 0 ]; then
            echo "pin applied to all three images, JWT_SECRET passed through, server settings intact"
          fi
          exit "$bad"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Caches ~/.npm keyed on package-lock.json. `npm ci` still installs
          # from the lock file, so a cold or stale cache only costs the download
          # it would have done anyway (ST-70).
          cache: 'npm'

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Build shared types package
        run: npm run build
        working-directory: packages/types

      - name: Install native bindings and jsdom
        run: npm install --no-save @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu jsdom

      - name: Lint
        run: npm run lint
        working-directory: apps/frontend

      - name: Prettier Format Check
        run: npm run format:check
        working-directory: apps/frontend

      - name: Run tests
        run: npm run test:ci
        working-directory: apps/frontend

      - name: Build project
        run: npm run build
        working-directory: apps/frontend

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: st44_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Caches ~/.npm keyed on package-lock.json. `npm ci` still installs
          # from the lock file, so a cold or stale cache only costs the download
          # it would have done anyway (ST-70).
          cache: 'npm'

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Build shared types package
        run: npm run build
        working-directory: packages/types

      - name: Prettier Format Check
        run: npm run format:check
        working-directory: apps/backend

      - name: Initialize test database
        run: psql -h localhost -U postgres -d st44_test -f docker/postgres/init.sql
        env:
          PGPASSWORD: postgres

      - name: Run tests
        run: npm test
        working-directory: apps/backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: st44_test
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres

      - name: Build
        run: npm run build
        working-directory: apps/backend
