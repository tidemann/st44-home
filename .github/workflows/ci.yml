name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # A floating tag lets an action move under a live deploy with no commit here.
  # This job is the cheapest check in CI, so it runs alongside the slow ones and
  # fails fast on an unpinned ref.
  workflows:
    name: Workflows are pinned by SHA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Actions are pinned by SHA
        run: |
          set -euo pipefail
          bad=0
          while read -r line; do
            ref="${line#*uses:}"
            # Drop the trailing `# v5` version comment before looking at the ref.
            ref="${ref%%#*}"
            ref="$(printf '%s' "$ref" | tr -d '[:space:]')"
            case "$ref" in
              ./*) continue ;;
            esac
            version="${ref#*@}"
            if ! printf '%s' "$version" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::not pinned by SHA: $ref"
              bad=1
            fi
          done < <(grep -rhE '^\s*-?\s*uses:' .github/workflows)
          exit "$bad"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # setup-node v5+ turns npm caching on by itself whenever package.json
          # has a `packageManager` field, which ours does. This step never cached
          # before, so keep it off here and change caching on its own commit.
          package-manager-cache: false

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Build shared types package
        run: npm run build
        working-directory: packages/types

      - name: Install native bindings and jsdom
        run: npm install --no-save @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu jsdom

      - name: Lint
        run: npm run lint
        working-directory: apps/frontend

      - name: Prettier Format Check
        run: npm run format:check
        working-directory: apps/frontend

      - name: Run tests
        run: npm run test:ci
        working-directory: apps/frontend

      - name: Build project
        run: npm run build
        working-directory: apps/frontend

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: st44_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # setup-node v5+ turns npm caching on by itself whenever package.json
          # has a `packageManager` field, which ours does. This step never cached
          # before, so keep it off here and change caching on its own commit.
          package-manager-cache: false

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Build shared types package
        run: npm run build
        working-directory: packages/types

      - name: Prettier Format Check
        run: npm run format:check
        working-directory: apps/backend

      - name: Initialize test database
        run: psql -h localhost -U postgres -d st44_test -f docker/postgres/init.sql
        env:
          PGPASSWORD: postgres

      - name: Run tests
        run: npm test
        working-directory: apps/backend
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_NAME: st44_test
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres

      - name: Build
        run: npm run build
        working-directory: apps/backend
