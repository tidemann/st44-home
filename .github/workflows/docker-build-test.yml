name: Docker Build Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'apps/backend/**'
      - 'packages/**'
      - 'infra/nginx/Dockerfile.frontend'
      - 'apps/backend/Dockerfile'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'apps/backend/**'
      - 'packages/**'
      - 'infra/nginx/Dockerfile.frontend'
      - 'apps/backend/Dockerfile'
      - 'package.json'
      - 'package-lock.json'
  # The paths filter above means a workflow-only change cannot reach these image
  # builds, so there was no way to exercise a build-push-action bump before it
  # landed on main and deployed. This makes that possible on a branch.
  workflow_dispatch:

jobs:
  test-frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build frontend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./infra/nginx/Dockerfile.frontend
          push: false
          tags: st44-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: false
          tags: st44-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # TEMPORARY, ST-53 only — delete before merge.
  #
  # The two jobs above build with `push: false` and no `build-args`. deploy.yml's
  # frontend build uses both, and deploy.yml only runs on push to main, so the
  # bump to build-push-action v7.4.0 could not be exercised against those two
  # inputs without deploying the live site first. This replicates that build step
  # exactly, except the tag is a throwaway rather than `:latest`, so nothing a
  # deploy would pull moves.
  temporary-verify-push-and-build-args:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./infra/nginx/Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:st53-verify
          build-args: |
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

      - name: The pushed tag resolves
        run: |
          set -euo pipefail
          tag="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:st53-verify"
          docker buildx imagetools inspect "$tag"
