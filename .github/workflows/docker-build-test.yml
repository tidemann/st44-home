name: Docker Build Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'apps/backend/**'
      - 'packages/**'
      - 'infra/nginx/Dockerfile.frontend'
      - 'apps/backend/Dockerfile'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'apps/backend/**'
      - 'packages/**'
      - 'infra/nginx/Dockerfile.frontend'
      - 'apps/backend/Dockerfile'
      - 'package.json'
      - 'package-lock.json'
  # The paths filter above means a workflow-only change cannot reach these image
  # builds, so there was no way to exercise a build-push-action bump before it
  # landed on main and deployed. This makes that possible on a branch.
  workflow_dispatch:

jobs:
  test-frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build frontend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./infra/nginx/Dockerfile.frontend
          push: false
          tags: st44-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: false
          tags: st44-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
