name: Deploy

# This workflow is a twin of tidemann/deploy-workflows .github/workflows/
# build-and-deploy.yml, which the rest of the estate calls instead of keeping a
# copy. A fix here -- an action bump, a permissions tightening, an ssh change --
# very probably belongs there too, and the other way round. Check before you
# assume otherwise; ST-53 and ST-59 both had to be applied twice.
#
# The two have not been merged because that one builds a single image and this is a
# three-image stack. ST-63 decided to extend the shared workflow "later", triggered
# by the third fix that has to land in both places.

on:
  push:
    branches: [main]

# Least privilege at the top; the three build jobs add packages:write for GHCR.
permissions:
  contents: read

# Two pushes to main must not race each other onto the same host. The second
# waits rather than interleaving a pull with the other run's compose up.
concurrency:
  group: deploy-st44-home
  cancel-in-progress: false

env:
  # The commit SHA is the deploy identity: every image this run pushes carries
  # it, the stack runs it, and a rollback names an earlier one. `latest` moves
  # with each deploy and is only a convenience pointer.
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
  REMOTE_DIR: /srv/st44-home/infra
  # The compose override carrying the pin. Lands in the deploy user's home, because
  # REMOTE_DIR belongs to the server owner and CI cannot write there. A name, not a
  # path: `$HOME` is resolved on the host, and /tmp is not used because anyone on
  # the box can write there and this file decides what the site runs.
  PIN_NAME: st44-home-image-pin.yml
  SITE_HOST: home.st44.no

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0  # Fetch full history for proper change detection

      - name: Get previous commit SHA
        id: prev-commit
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"

      - name: Check for code changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.prev-commit.outputs.sha }}  # Compare against previous commit SHA
          filters: |
            code:
              - 'apps/**'
              - '!apps/**/e2e/**'
              - '!apps/**/*.spec.ts'
              - '!apps/**/*.test.ts'
              - 'infra/**'
              - 'docker/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'

  build-and-push-frontend:
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # setup-node v5+ turns npm caching on by itself whenever package.json
          # has a `packageManager` field, which ours does. This step never cached
          # before, so keep it off here and change caching on its own commit.
          package-manager-cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./infra/nginx/Dockerfile.frontend
          push: true
          # The SHA tag is the immutable one. `latest` is pushed from the same
          # build so a hand-started stack is not left on an ancient image.
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          build-args: |
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

  build-and-push-backend:
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-backend:latest

  build-and-push-database:
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Database Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/postgres
          file: ./docker/postgres/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-db:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_PREFIX }}-db:latest

  deploy-to-server:
    needs: [build-and-push-frontend, build-and-push-backend, build-and-push-database]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # One ssh alias, so the host and user are named once and no later step has
      # to re-interpolate a secret into a command line.
      - name: Configure ssh
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # StrictHostKeyChecking=yes, so a swapped host key fails the deploy
          # rather than silently trusting a new one.
          ssh-keyscan -H '${{ secrets.SERVER_HOST }}' >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      # Rollback anchor: name the artifacts running now, before replacing them.
      # Recorded first, and into the run summary, so a later failure still leaves
      # the previous tags written down somewhere durable.
      - name: Record the currently deployed images
        run: |
          set -euo pipefail
          ssh deploy-target bash -s <<'REMOTE' | tee previous-images.txt
          set -uo pipefail
          for c in st44-frontend st44-backend st44-db; do
            printf '%s\t%s\n' "$c" \
              "$(docker inspect -f '{{.Config.Image}} {{.Image}}' "$c" 2>/dev/null || echo 'none (not running)')"
          done
          REMOTE

          {
            echo '## Rollback anchor'
            echo
            echo 'Images running *before* this deploy:'
            echo
            echo '```'
            cat previous-images.txt
            echo '```'
            echo
            echo "This deploy moves the stack to \`IMAGE_TAG=${IMAGE_TAG}\`."
            echo 'To roll back, see docs/DEPLOYMENT.md -> "Rolling back to a previous image".'
          } >> "$GITHUB_STEP_SUMMARY"

      # The pin arrives as a compose override, not as an edit to the host's compose
      # file. /srv/st44-home/infra is owned by the server owner and is not writable
      # by the deploy user, and who may write it is the server's call, not CI's --
      # so this writes one small file into the deploy user's own home and lets
      # compose merge it over the host's. `image:` in a later file wins, so the
      # host copy can go on saying `:latest` and the stack still runs the SHA.
      #
      # `.env` beside the host compose file still supplies DB_PASSWORD and friends:
      # the project directory is the first file's directory, which is why every
      # compose call below runs from REMOTE_DIR. CI never reads or writes it.
      - name: Send the image pin
        run: |
          set -euo pipefail
          # Same script CI uses to prove the merge works -- see the compose job.
          infra/generate-image-pin.sh "${IMAGE_PREFIX}" "${IMAGE_TAG}" > image-pin.yml
          cat image-pin.yml
          # No leading path: scp drops it in the deploy user's home directory.
          scp image-pin.yml "deploy-target:${PIN_NAME}"

      - name: Deploy data services via SSH
        run: |
          set -euo pipefail
          ssh deploy-target REMOTE_DIR="${REMOTE_DIR}" PIN_NAME="${PIN_NAME}" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_DIR"
          export COMPOSE_FILE="docker-compose.yml:$HOME/$PIN_NAME"
          docker compose config --quiet
          docker compose pull
          docker compose up -d --force-recreate db redis
          REMOTE

      - name: Run Database Migrations
        run: |
          set -euo pipefail
          echo "Running database migrations..."
          ssh deploy-target "docker exec st44-db /usr/local/bin/run-migrations.sh"

      - name: Start Application Services
        run: |
          set -euo pipefail
          ssh deploy-target REMOTE_DIR="${REMOTE_DIR}" PIN_NAME="${PIN_NAME}" bash -s <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_DIR"
          export COMPOSE_FILE="docker-compose.yml:$HOME/$PIN_NAME"
          docker compose up -d --force-recreate backend frontend
          REMOTE

      - name: Show container state
        run: |
          set -euo pipefail
          ssh deploy-target 'docker ps --filter "name=st44" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"'

      # Readiness, not a stopwatch. The old `sleep 15` passed or failed on how
      # fast the host happened to be that morning; this polls until the backend
      # actually answers, and dumps logs when it never does.
      - name: Verify the backend is ready
        run: |
          set -euo pipefail
          ssh deploy-target bash -s <<'REMOTE'
          set -uo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "backend /health: ok after $i attempt(s)"
              curl -sS http://localhost:3000/health/database | head -20 || true
              exit 0
            fi
            sleep 2
          done
          echo "backend never answered http://localhost:3000/health"
          docker logs --tail 50 st44-backend 2>&1 || true
          exit 1
          REMOTE

      # Proves the pin took. Without this, a compose file that had drifted back
      # to `:latest` would still pass every health check above.
      - name: Verify the deployed images are the ones this run built
        run: |
          set -euo pipefail
          ssh deploy-target IMAGE_TAG="${IMAGE_TAG}" bash -s <<'REMOTE'
          set -uo pipefail
          bad=0
          for c in st44-frontend st44-backend st44-db; do
            running="$(docker inspect -f '{{.Config.Image}}' "$c")"
            echo "$c -> $running"
            case "$running" in
              *":${IMAGE_TAG}") ;;
              *) echo "::error::$c is running $running, not the tag this deploy built"; bad=1 ;;
            esac
          done
          exit "$bad"
          REMOTE

      - name: Purge Cloudflare Cache
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' > /dev/null
          echo "cache purged"

      # The deploy is finished when the public hostname answers, not when the
      # container turns green. Runs last, after the purge, so this is the gate.
      - name: Verify the public health endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            # curl already reports 000 for a connection or TLS failure; `|| true`
            # only stops `set -e` from aborting the retry loop.
            code="$(curl -sS -o /dev/null -w '%{http_code}' "https://${SITE_HOST}/health" || true)"
            if [ "$code" = "200" ]; then
              echo "public health: 200 over valid TLS"
              exit 0
            fi
            echo "attempt $i: http=$code"
            sleep 10
          done
          echo "::error::https://${SITE_HOST}/health did not return 200"
          exit 1

      - name: Record the deployed tag
        if: always()
        run: |
          set -euo pipefail
          {
            echo
            echo '## Deployed artifact'
            echo
            echo '| service | image |'
            echo '| --- | --- |'
            for svc in frontend backend db; do
              echo "| $svc | \`${IMAGE_PREFIX}-${svc}:${IMAGE_TAG}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
